<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="title desc">
  <title id="title">SyncPay payment lifecycle</title>
  <desc id="desc">A payment packet is synchronized, validated, requested for settlement, settled, and completed through Kafka commands and events.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="1120" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#172033">SyncPay payment lifecycle</text>
  <text x="500" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Offline packet synchronization through saga-driven settlement</text>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172033" text-anchor="middle">
    <rect x="80" y="105" width="210" height="64" rx="10" fill="#eef4ff" stroke="#3566b8" stroke-width="2"/>
    <text x="185" y="132" font-size="18" font-weight="700">Browser</text>
    <text x="185" y="153" font-size="14">offline client</text>
    <rect x="395" y="105" width="210" height="64" rx="10" fill="#eef4ff" stroke="#3566b8" stroke-width="2"/>
    <text x="500" y="132" font-size="18" font-weight="700">Payment Service</text>
    <text x="500" y="153" font-size="14">crypto and ledger</text>
    <rect x="710" y="105" width="210" height="64" rx="10" fill="#eef4ff" stroke="#3566b8" stroke-width="2"/>
    <text x="815" y="132" font-size="18" font-weight="700">Saga Service</text>
    <text x="815" y="153" font-size="14">workflow coordinator</text>

    <rect x="100" y="210" width="800" height="78" rx="12" fill="#fff7e6" stroke="#c47b00" stroke-width="2"/>
    <text x="500" y="241" font-size="18" font-weight="700">1. Queue and synchronize packet</text>
    <text x="500" y="266" font-size="15">Create, encrypt, sign, and store offline; sync on reconnect</text>

    <rect x="100" y="340" width="800" height="78" rx="12" fill="#f7f9fc" stroke="#536273" stroke-width="2"/>
    <text x="500" y="371" font-size="18" font-weight="700">2. Verify and durably accept payment</text>
    <text x="500" y="396" font-size="15">Verify signature, decrypt, validate fields, and check nonce replay</text>

    <rect x="100" y="470" width="800" height="78" rx="12" fill="#e9f8ef" stroke="#238636" stroke-width="2"/>
    <text x="500" y="501" font-size="18" font-weight="700">3. Commit synchronization</text>
    <text x="500" y="526" font-size="15">One PostgreSQL transaction: payment, lifecycle, and outbox</text>

    <rect x="100" y="600" width="800" height="78" rx="12" fill="#f7f9fc" stroke="#536273" stroke-width="2"/>
    <text x="500" y="631" font-size="18" font-weight="700">4. Validate through Kafka</text>
    <text x="500" y="656" font-size="15">Synchronized event → saga state → validate-payment command → VALIDATED</text>

    <rect x="100" y="730" width="800" height="78" rx="12" fill="#f7f9fc" stroke="#536273" stroke-width="2"/>
    <text x="500" y="761" font-size="18" font-weight="700">5. Request settlement through Kafka</text>
    <text x="500" y="786" font-size="15">Payment validated → settlement request → SETTLEMENT_REQUESTED</text>

    <rect x="100" y="860" width="800" height="78" rx="12" fill="#e9f8ef" stroke="#238636" stroke-width="2"/>
    <text x="500" y="891" font-size="18" font-weight="700">6. Complete settlement</text>
    <text x="500" y="916" font-size="15">Atomic debit and credit, two ledger entries, then SETTLED</text>

    <rect x="100" y="990" width="800" height="78" rx="12" fill="#fff7e6" stroke="#c47b00" stroke-width="2"/>
    <text x="500" y="1021" font-size="18" font-weight="700">Failure and recovery</text>
    <text x="500" y="1046" font-size="15">payment-failed → compensation → SAGA_COMPENSATED; stuck sagas → MANUAL_REVIEW</text>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M500 288 V340"/>
    <path d="M500 418 V470"/>
    <path d="M500 548 V600"/>
    <path d="M500 678 V730"/>
    <path d="M500 808 V860"/>
    <path d="M500 938 V990"/>
  </g>
</svg>
