server:
  port: 8081

spring:
  application:
    name: payment-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meshpay_payment}
    username: ${SPRING_DATASOURCE_USERNAME:meshpay}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    baseline-on-migrate: true
    # An unversioned, non-empty legacy database is baselined at 0 so all
    # compatibility migrations (including nullable settled_at) are applied.
    baseline-version: 0
    locations: classpath:db/migration,classpath:db/migration-v2,classpath:db/migration-v3
  
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}
  
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record
      missing-topics-fatal: false
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  ratelimiter:
    instances:
      packetSync:
        limit-for-period: 40
        limit-refresh-period: 1s
        timeout-duration: 0
  circuitbreaker:
    instances:
      sagaService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 10
  retry:
    instances:
      sagaService:
        max-attempts: 3
        wait-duration: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

meshpay:
  packet:
    server-private-key: ${MESHPAY_PACKET_RSA_PRIVATE_KEY:}
    server-public-key: ${MESHPAY_PACKET_RSA_PUBLIC_KEY:}
    # senderVpa=base64(X.509 RSA public key), entries separated by semicolons.
    trusted-signers: ${MESHPAY_PACKET_TRUSTED_SIGNERS:}
    max-offline-age: ${MESHPAY_PACKET_MAX_OFFLINE_AGE:30d}
  outbox:
    max-retries: ${MESHPAY_OUTBOX_MAX_RETRIES:10}
    enabled: ${MESHPAY_OUTBOX_ENABLED:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
