server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/payment/ { proxy_pass http://api-gateway:8080/api/payment/; proxy_set_header Host $host; }
  location /api/saga/ { proxy_pass http://api-gateway:8080/api/saga/; proxy_set_header Host $host; }
  location /payment-health/ { proxy_pass http://payment-service:8081/actuator/health; }
  location /saga-health/ { proxy_pass http://saga-service:8082/actuator/health; }
  location / { try_files $uri $uri/ /index.html; }
}
