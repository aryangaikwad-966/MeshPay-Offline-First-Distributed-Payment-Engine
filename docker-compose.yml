services:
  # PostgreSQL Database for Payment Service
  postgres-payment:
    image: postgres:16-alpine
    container_name: meshpay-postgres-payment
    environment:
      POSTGRES_DB: meshpay_payment
      POSTGRES_USER: ${DB_USER:-meshpay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - meshpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-meshpay} -d meshpay_payment"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for Saga Service
  postgres-saga:
    image: postgres:16-alpine
    container_name: meshpay-postgres-saga
    environment:
      POSTGRES_DB: meshpay_saga
      POSTGRES_USER: ${DB_USER:-meshpay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5434:5432"
    volumes:
      - postgres_saga_data:/var/lib/postgresql/data
    networks:
      - meshpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-meshpay} -d meshpay_saga"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (for distributed idempotency)
  redis:
    image: redis:7-alpine # redis image
    container_name: meshpay-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - meshpay-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: meshpay-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - meshpay-network

  # Kafka (event-driven architecture)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: meshpay-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_CREATE_TOPICS: "saga-validate-payment-command:1:1,saga-request-settlement-command:1:1,saga-complete-settlement-command:1:1,payment-validated:1:1,payment-settlement-requested:1:1,payment-settled:1:1,payment-failed:1:1,saga-completed:1:1,saga-failed:1:1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - meshpay-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Eureka Server
  eureka-server:
    build:
      context: ./meshpay-eureka-server
      dockerfile: Dockerfile
    container_name: meshpay-eureka-server
    ports:
      - "8761:8761"
    networks:
      - meshpay-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./meshpay-api-gateway
      dockerfile: Dockerfile
    container_name: meshpay-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - meshpay-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Payment Service
  payment-service:
    build:
      context: ./meshpay-payment-service
      dockerfile: Dockerfile
    container_name: meshpay-payment-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/meshpay_payment
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-meshpay}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - meshpay-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Saga Service
  saga-service:
    build:
      context: ./meshpay-saga-service
      dockerfile: Dockerfile
    container_name: meshpay-saga-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-saga:5432/meshpay_saga
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-meshpay}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-saga:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - meshpay-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  meshpay-network:
    driver: bridge

volumes:
  postgres_payment_data:
    driver: local
  postgres_saga_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local

