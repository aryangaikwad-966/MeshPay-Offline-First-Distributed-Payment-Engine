name: syncpay

services:
  # PostgreSQL Database for Payment Service
  postgres-payment:
    image: postgres:16-alpine
    container_name: syncpay-engine-postgres-payment
    environment:
      POSTGRES_DB: syncpay_payment
      POSTGRES_USER: ${DB_USER:-syncpay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - syncpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-syncpay} -d syncpay_payment"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for Saga Service
  postgres-saga:
    image: postgres:16-alpine
    container_name: syncpay-engine-postgres-saga
    environment:
      POSTGRES_DB: syncpay_saga
      POSTGRES_USER: ${DB_USER:-syncpay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_saga_data:/var/lib/postgresql/data
    networks:
      - syncpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-syncpay} -d syncpay_saga"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (for distributed idempotency)
  redis:
    image: redis:7-alpine # redis image
    container_name: syncpay-engine-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - syncpay-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: syncpay-engine-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - syncpay-network

  # Kafka (event-driven architecture)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: syncpay-engine-kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_CREATE_TOPICS: "saga-validate-payment-command:1:1,saga-request-settlement-command:1:1,saga-complete-settlement-command:1:1,payment-packet-synchronized:1:1,payment-validated:1:1,payment-settlement-requested:1:1,payment-settled:1:1,payment-failed:1:1,saga-completed:1:1,saga-failed:1:1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - syncpay-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Eureka Server
  eureka-server:
    build:
      context: ./syncpay-eureka-server
      dockerfile: Dockerfile
    container_name: syncpay-engine-eureka-server
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - syncpay-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./syncpay-api-gateway
      dockerfile: Dockerfile
    container_name: syncpay-engine-api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SYNCPAY_JWKS_URI: ${SYNCPAY_JWKS_URI:-}
      SYNCPAY_JWT_ISSUER: ${SYNCPAY_JWT_ISSUER:-}
      SYNCPAY_JWT_AUDIENCE: ${SYNCPAY_JWT_AUDIENCE:-}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - syncpay-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Payment Service
  payment-service:
    build:
      context: ./syncpay-payment-service
      dockerfile: Dockerfile
    container_name: syncpay-engine-payment-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/syncpay_payment
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-syncpay}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SYNCPAY_PACKET_RSA_PRIVATE_KEY: ${SYNCPAY_PACKET_RSA_PRIVATE_KEY:-}
      SYNCPAY_PACKET_RSA_PUBLIC_KEY: ${SYNCPAY_PACKET_RSA_PUBLIC_KEY:-}
      SYNCPAY_PACKET_TRUSTED_SIGNERS: ${SYNCPAY_PACKET_TRUSTED_SIGNERS:-}
      SYNCPAY_PACKET_MAX_OFFLINE_AGE: ${SYNCPAY_PACKET_MAX_OFFLINE_AGE:-30d}
      SYNCPAY_OUTBOX_MAX_RETRIES: ${SYNCPAY_OUTBOX_MAX_RETRIES:-10}
      SYNCPAY_OUTBOX_ENABLED: ${SYNCPAY_OUTBOX_ENABLED:-true}
      SYNCPAY_JWKS_URI: ${SYNCPAY_JWKS_URI:-}
      SYNCPAY_JWT_ISSUER: ${SYNCPAY_JWT_ISSUER:-}
      SYNCPAY_JWT_AUDIENCE: ${SYNCPAY_JWT_AUDIENCE:-}
    depends_on:
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - syncpay-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Saga Service
  saga-service:
    build:
      context: ./syncpay-saga-service
      dockerfile: Dockerfile
    container_name: syncpay-engine-saga-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-saga:5432/syncpay_saga
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-syncpay}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SYNCPAY_JWKS_URI: ${SYNCPAY_JWKS_URI:-}
      SYNCPAY_JWT_ISSUER: ${SYNCPAY_JWT_ISSUER:-}
      SYNCPAY_JWT_AUDIENCE: ${SYNCPAY_JWT_AUDIENCE:-}
    depends_on:
      postgres-saga:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - syncpay-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: syncpay-engine-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - payment-service
      - saga-service
      - api-gateway
    networks:
      - syncpay-network

  grafana:
    image: grafana/grafana:11.2.2
    container_name: syncpay-engine-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - syncpay-network

  dashboard:
    build:
      context: ./syncpay-dashboard
      dockerfile: Dockerfile
    container_name: syncpay-engine-dashboard
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - payment-service
      - saga-service
    networks:
      - syncpay-network

  # SonarQube Community Edition for static analysis. Opt-in profile so it does
  # not start with the default stack: docker compose --profile sonar up -d
  sonarqube:
    image: sonarqube:community
    container_name: syncpay-engine-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - syncpay-network
    profiles:
      - sonar

networks:
  syncpay-network:
    driver: bridge

volumes:
  postgres_payment_data:
    driver: local
  postgres_saga_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
